services:
  fighter-manager:
    image: us-central1-docker.pkg.dev/project-afa815fe-26c6-40c3-a8b/codejitsu-repo/fighter-manager:latest
    restart: unless-stopped
    ports:
      - "7080:7080"
    env_file: .env
    environment:
      - ASPNETCORE_APP_DB=${SUPABASE_APP_DB}
    networks:
      - appnet
  video-analysis:
    image: us-central1-docker.pkg.dev/project-afa815fe-26c6-40c3-a8b/codejitsu-repo/video-analysis:latest
    restart: unless-stopped
    ports:
      - "7081:7081"
    env_file: .env
    environment:
      - ASPNETCORE_APP_DB=${SUPABASE_APP_DB}
    # Keyless auth: the app uses Application Default Credentials from the VM's attached
    # service account (codejitsu-vm-runtime). No mounted SA key (org policy
    # constraints/iam.disableServiceAccountKeyCreation blocks key creation on MyCoach).
    networks:
      - appnet
  app-client:
    image: us-central1-docker.pkg.dev/project-afa815fe-26c6-40c3-a8b/codejitsu-repo/app-client:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./CodeJitsu.Client/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./CodeJitsu.Client/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt/config:/etc/letsencrypt
      - ./letsencrypt/webroot:/var/www/certbot
    depends_on:
      - fighter-manager
      - video-analysis
    networks:
      - appnet
networks:
  appnet:
    driver: bridge