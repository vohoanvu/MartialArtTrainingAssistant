services:
  fighter-manager:
    image: us-central1-docker.pkg.dev/codejitsu/codejitsu-repo/fighter-manager:latest
    ports:
      - "7080:7080"
    env_file: .env
    environment:
      - ASPNETCORE_APP_DB=${SUPABASE_APP_DB}
    networks:
      - appnet
  video-analysis:
    image: us-central1-docker.pkg.dev/codejitsu/codejitsu-repo/video-analysis:latest
    ports:
      - "7081:7081"
    env_file: .env
    environment:
      - ASPNETCORE_APP_DB=${SUPABASE_APP_DB}
    volumes:
      - ./secrets/gcs-key.json:/app/secrets/codejitsu-cloud-storage-service-account.json:ro
    networks:
      - appnet
  match-maker:
    image: us-central1-docker.pkg.dev/codejitsu/codejitsu-repo/match-maker:latest
    ports:
      - "7082:7082"
    env_file: .env
    environment:
      - ASPNETCORE_APP_DB=${SUPABASE_APP_DB}
    networks:
      - appnet
  app-client:
    image: us-central1-docker.pkg.dev/codejitsu/codejitsu-repo/app-client:latest
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./CodeJitsu.Client/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./CodeJitsu.Client/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt/config:/etc/letsencrypt
      - ./letsencrypt/webroot:/var/www/certbot
    depends_on:
      - fighter-manager
      - video-analysis
      - match-maker
    networks:
      - appnet
networks:
  appnet:
    driver: bridge